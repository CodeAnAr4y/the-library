<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Library</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <div class="container">
        <div class="header-content">
          <div class="title-block">
            <img src="/assets/book.svg" alt="Book" />
            <div class="header-text">
              <h2>The Library</h2>
              <p>Discover your next favorite book</p>
            </div>
          </div>
          <button id="themeBtn" class="theme-btn">
            <img
              id="themeIcon"
              src="/assets/theme/light-mode-icon.svg"
              alt=""
            />
          </button>
        </div>
      </div>
    </header>

    <div class="main">
      <!-- Search -->
      <div class="search-container">
        <div class="search">
          <h1>Discover your next great read</h1>
          <p>
            Search millons of books, build your personal library, and never lose
            track of what to read next
          </p>
          <div class="input-container">
            <div class="input">
              <img src="/assets/search.svg" alt="" />
              <input
                id="searchInput"
                type="text"
                placeholder="Search for books by title or author..."
              />
            </div>
            <button id="searchBtn">Search</button>
          </div>
        </div>
      </div>
      <div class="container main-sections">
        <section class="books-container">
          <div id="resultsGrid" class="books-grid"></div>
        </section>
        <aside class="fav-books-container">
          <div class="fav-title">
            <img src="/assets/heart.svg" alt="" />
            <div class="fav-text">
              <h4>Favorites</h4>
              <p id="booksCount" class="books-count">0 books saved</p>
            </div>
          </div>
          <div id="favList" class="fav-list-container"></div>
        </aside>
      </div>
    </div>

    <footer>
      <p>
        Powered by
        <a href="#">Open Library</a>
      </p>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
